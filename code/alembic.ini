# Alembic configuration for FoodLink.
#
# Run from anywhere by pointing at this file explicitly:
#
#     alembic -c code/alembic.ini upgrade head
#
# or from the `code/` directory (where the CLI and seed script are also run):
#
#     alembic upgrade head
#
# There is deliberately no `sqlalchemy.url` here. The database URL comes from
# `foodlink.config.Settings` (i.e. `DATABASE_URL`), so migrations and the
# application can never be pointed at two different databases, and no
# environment-specific value is committed. See `migrations/env.py`.

[alembic]
# %(here)s is this file's directory, so the paths below do not depend on the
# working directory the command was launched from.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os


# Logging. Consumed by env.py's fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
