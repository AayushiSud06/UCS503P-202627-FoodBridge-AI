# Automated validation for FoodLink.
#
# Three regressions this is meant to catch, and nothing else: a backend test
# breaking, a TypeScript/build error in the frontend, and a model change
# committed without an Alembic revision. Deployment is deliberately out of
# scope — the project has no deployment configuration (see ai/PROJECT_STATE.md).
#
# `.github/workflows/mkdocs.yml` still owns documentation deployment; the two
# are kept separate because they answer different questions and one failing
# should not hide the other.

name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend tests + migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The code uses 3.10+ union syntax (`X | None`) and is developed on
          # 3.13. Note that the root `pyproject.toml` still declares
          # `requires-python = ">=3.8"` from the course template; that value is
          # wrong for this codebase and is tracked in ai/TASKS.md → Cleanup.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            code/requirements.txt
            code/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r code/requirements-dev.txt

      # No signing key is exported here on purpose: `code/tests/conftest.py`
      # sets its own test key before importing the app, so the suite proves it
      # is self-contained rather than depending on the environment.
      - name: Run backend tests
        run: pytest code/tests

      # `alembic check` reports a non-zero exit when the models have drifted
      # from the revision history. It needs a database at head to compare
      # against, so the workspace gets a throwaway SQLite file first.
      #
      # FOODLINK_SECRET_KEY is required because `migrations/env.py` resolves the
      # database URL through `foodlink.config.Settings`, which is fail-closed
      # (see ai/DECISIONS.md D-22). The value below is a literal placeholder
      # that exists only to satisfy that check — it signs nothing here, it is
      # not a secret, and it must never be used anywhere reachable.
      - name: Check migrations match the models
        env:
          FOODLINK_SECRET_KEY: ci-placeholder-key-not-a-secret-signs-nothing
          DATABASE_URL: sqlite:///./ci-alembic-check.db
        run: |
          alembic -c code/alembic.ini upgrade head
          alembic -c code/alembic.ini check

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # `npm run build` is `tsc && vite build`, so this is the type check too.
      - name: Build frontend
        run: npm run build
